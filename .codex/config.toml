model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
service_tier = "default"
model_auto_compact_token_limit = 96000
model_auto_compact_token_limit_scope = "total"
project_doc_max_bytes = 12288
tool_output_token_limit = 6000

[features]
apps = false
browser_use = false
computer_use = false
fast_mode = false
hooks = true
in_app_browser = false
memories = false
multi_agent = true
multi_agent_v2 = { enabled = true, max_concurrent_threads_per_session = 5, expose_spawn_agent_model_overrides = true, wait_agent_enabled = true, non_code_mode_only = true }
plugins = false
recommended_plugins = false

[memories]
generate_memories = false
use_memories = false

[agents]
enabled = true
max_concurrent_threads_per_session = 5
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = false

[mcp_servers.node_repl]
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
args = []
enabled = false

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
enabled = false

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."engineering-skills@claude-code-skills"]
enabled = false

[plugins."context7@claude-plugins-official"]
enabled = false

[plugins."playwright@claude-plugins-official"]
enabled = false

[plugins."superpowers@claude-plugins-official"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false
