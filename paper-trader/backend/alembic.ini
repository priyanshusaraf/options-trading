# Alembic config for the EXECUTION database (paper_trader.db).
#
# There is deliberately no sqlalchemy.url here. The URL is never configured in a
# file: `app/db/migrate.py` passes the live SQLAlchemy connection through
# `config.attributes["connection"]`, so migrations always run against whatever
# database the process is actually bound to (PT_DB_PATH), including the throwaway
# per-run file a pytest session uses. A URL in this file would be a second source
# of truth for "which database", and the first time those two disagreed it would
# migrate the wrong one.
#
# The `alembic` CLI is therefore not the supported entry point; use:
#     .venv/bin/python -m app.db.migrate --help
#
# The ledger (ledger.db) and research (research.db) databases are NOT managed
# here. They keep their own additive initialisers: both are isolated by design
# (separate declarative bases, no cross-imports) and neither is touched by the
# deployment/strategy/config migrations this framework exists to carry.

[alembic]
script_location = migrations
# Timestamped, ordered filenames — a migration's position in the sequence should
# be readable without opening it.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
