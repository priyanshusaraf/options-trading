services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PT_POSTGRES_DB:-strategy_os_dev}
      POSTGRES_USER: ${PT_POSTGRES_USER:-strategy_os_dev}
      POSTGRES_PASSWORD: ${PT_POSTGRES_PASSWORD:?set PT_POSTGRES_PASSWORD in your shell or .env}
    ports:
      - "${PT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - strategy-os-postgres:/var/lib/postgresql/data

volumes:
  strategy-os-postgres:
